<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MTM6303 Final Checklist 26F — Sneza M Drouin</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <div>
        <span class="badge">26F_MTM6303_010 • Algonquin College</span>
        <h1>Assignment 2 &rarr; Final Project 1 Follow-Along &amp; Checklist</h1>
        <p class="subtitle">Author: <strong>Sneza M Drouin</strong> &bull; Theme: <code>cms2-project</code> (Serbia Guide)</p>
      </div>
      <div class="progress-card" aria-live="polite">
        <div class="progress-top">
          <span id="progress-label">0 / 0 Completed</span>
          <span id="progress-percent">0%</span>
        </div>
        <div class="progress-track">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
        <div class="backup-actions">
          <button type="button" id="btn-export" class="btn-secondary">Export Progress (.json)</button>
          <label for="file-import" class="btn-secondary file-label">Import Backup</label>
          <input type="file" id="file-import" accept=".json" hidden />
          <button type="button" id="btn-reset" class="btn-danger">Reset</button>
        </div>
      </div>
    </div>

    <nav class="tabs" aria-label="Checklist sections">
      <button type="button" class="tab-btn active" data-filter="all">All Steps (<span id="count-all">0</span>)</button>
      <button type="button" class="tab-btn" data-filter="a2">Part 1: Assignment 2 Base (<span id="count-a2">0</span>)</button>
      <button type="button" class="tab-btn" data-filter="fp1">Part 2: Final Project 1 (<span id="count-fp1">0</span>)</button>
      <button type="button" class="tab-btn" data-filter="submit">Part 3: Logs &amp; ZIP Submission (<span id="count-submit">0</span>)</button>
    </nav>
  </header>

  <main class="container">
    <div id="steps-container"></div>
  </main>

  <footer class="app-footer">
    <p>Progress &amp; notes automatically save to your browser's <code>localStorage</code> on <strong>mysticstorms.github.io/final-checklist-26F</strong>.</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
